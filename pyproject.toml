[project]
name = "any2mcp"
version = "0.1.0"
description = "Turn any Python module into an MCP server. No decorators required."
readme = "README.md"
license = "MIT"
authors = [
    { name = "SanoberRehman", email = "149917727+SanoberRehman@users.noreply.github.com" }
]
keywords = ["mcp", "model-context-protocol", "llm", "agents", "tools", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/SanoberRehman/any2mcp"
Repository = "https://github.com/SanoberRehman/any2mcp"
Issues = "https://github.com/SanoberRehman/any2mcp/issues"

[project.scripts]
any2mcp = "any2mcp.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=8",
    "pytest-anyio>=0.0.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Fixtures deliberately use legacy typing (Optional/Union) and odd shapes to
# prove the schema generator handles them; don't "modernize" them away.
"tests/fixtures/*" = ["UP", "F401", "ANN"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
